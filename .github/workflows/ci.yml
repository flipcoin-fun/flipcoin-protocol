name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # SDK tests (Vitest)
  # ──────────────────────────────────────────────
  sdk-tests:
    name: SDK Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install

      - name: Run tests
        run: npx vitest run

      - name: TypeScript compile check
        run: npx tsc --noEmit

  # ──────────────────────────────────────────────
  # Solidity tests (Foundry)
  # ──────────────────────────────────────────────
  foundry-tests:
    name: Foundry Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Remove submodule test/certora files (incompatible paths)
        run: |
          rm -rf contracts/lib/prb-math/test
          rm -rf contracts/lib/openzeppelin-contracts/test
          rm -rf contracts/lib/openzeppelin-contracts/certora

      - name: Run forge build
        run: forge build

      - name: Run forge tests
        run: forge test -v
